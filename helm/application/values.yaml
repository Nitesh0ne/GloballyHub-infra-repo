replicaCount: 2

image:
  repository: docker.io/nitace/globallyhub-app
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

containerPort: 3000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

database:
  host: postgresql
  port: 5432
  existingSecret: globallyhub-db
  nameKey: DB_NAME
  usernameKey: DB_USERNAME
  passwordKey: DB_PASSWORD
  schemaKey: DB_SCHEMA

application:
  env: staging
  existingSecret: globallyhub-app
  cookieSecretKey: COOKIE_SECRET
  superadminUsernameKey: SUPERADMIN_USERNAME
  superadminPasswordKey: SUPERADMIN_PASSWORD

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

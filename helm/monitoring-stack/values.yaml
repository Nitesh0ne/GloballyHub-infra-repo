kube-prometheus-stack:
  grafana:
    enabled: true

  prometheus:
    enabled: true
    prometheusSpec:
      # Ensures Prometheus instance can be scheduled without requiring PVCs if no StorageClass exists
      storageSpec: {}

  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage: {}

loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  singleBinary:
    replicas: 1

  gateway:
    enabled: false

  backend:
    replicas: 0

  read:
    replicas: 0

  write:
    replicas: 0

  # --- Cache Sub-chart Disables ---
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Completely disable Memcached dependency charts
  memcached:
    enabled: false
  memcachedChunks:
    enabled: false
  memcachedExporter:
    enabled: false

alloy:
  controller:
    type: daemonset
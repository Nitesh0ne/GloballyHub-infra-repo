---
- name: Install Canonical Kubernetes on all nodes
  hosts: k8s
  become: true
  gather_facts: true

  tasks:
    - name: Install Canonical Kubernetes snap
      ansible.builtin.command:
        cmd: snap install k8s --classic --channel=1.35-classic/stable
      register: k8s_snap_install
      changed_when: k8s_snap_install.rc == 0